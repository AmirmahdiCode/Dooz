<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به دوز | XO Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f0f4f8;
      --bg2: #e2e8f0;
      --primary: #2C4F6E;
      --primary-dark: #1A3A52;
      --primary-light: #7BA5C9;
      --primary-rgb: 44, 79, 110;
      --dark: #0f172a;
      --text: #334155;
      --text-light: #94a3b8;
      --white: #ffffff;
      --card-bg: #ffffff;
      --card-border: #000000;
      --shadow: 4px 4px 0 #000000;
      --shadow-hover: 6px 6px 0 #000000;
      --shadow-sm: 2px 2px 0 #000000;
      --logo-filter: none;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg2: #1e293b;
      --primary: #4A7FA3;
      --primary-dark: #2C4F6E;
      --primary-light: #7BA5C9;
      --primary-rgb: 74, 127, 163;
      --dark: #f1f5f9;
      --text: #cbd5e1;
      --text-light: #64748b;
      --white: #1e293b;
      --card-bg: #1e293b;
      --card-border: #000000;
      --logo-filter: brightness(0) invert(1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
      padding: 16px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      border: 1px solid #000;
      overflow: hidden;
      padding: 8px;
      margin-bottom: 12px;
    }
    .logo-img img { width: 100%; height: 100%; object-fit: contain; }
    .site-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--dark);
      margin-top: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #000;
      border-radius: 4px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #000;
    }
    .tab-btn {
      flex: 1;
      padding: 14px;
      background: var(--bg2);
      border: none;
      border-left: 1px solid #000;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s;
      font-family: inherit;
    }
    .tab-btn:last-child { border-left: none; }
    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-dark);
      box-shadow: inset 0 -3px 0 var(--primary);
    }

    .tab-content {
      display: none;
      padding: 24px;
    }
    .tab-content.active { display: block; }

    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--dark);
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #000;
      border-radius: 4px;
      font-size: 14px;
      background: var(--bg);
      color: var(--dark);
      box-shadow: var(--shadow-sm);
      transition: all 0.15s;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #000;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.15s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot-link {
      display: block;
      text-align: right;
      margin-top: 12px;
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover { text-decoration: underline; }

    .error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      min-height: 18px;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--card-bg);
      border: 1px solid #000;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      color: var(--text);
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" title="تغییر تم">
    <i class="fa-solid fa-moon"></i>
  </button>

  <div class="login-container">
    <div class="logo-section">
      <div class="logo-img">
        <img src="https://cdn.imgurl.ir/uploads/u808451_InShot_20260809_201438207.png" alt="لوگو">
      </div>
      <div class="site-title">X O . G A M E</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">ورود</button>
        <button class="tab-btn" onclick="switchTab('register')">ثبت‌نام</button>
      </div>

      <!-- Tab ورود -->
      <div class="tab-content active" id="login-tab">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" id="loginUsername" placeholder="Username" required>
          </div>
          <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="loginPassword" placeholder="Password" required>
          </div>
          <div class="error-msg" id="loginError"></div>
          <button type="submit" class="btn" id="loginBtn">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> ورود
          </button>
          <a href="./forget/" class="forgot-link">فراموشی رمز عبور؟</a>
        </form>
      </div>

      <!-- Tab ثبت‌نام -->
      <div class="tab-content" id="register-tab">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" id="regUsername" placeholder="انتخاب نام کاربری" required>
          </div>
          <div class="form-group">
            <label>نام نمایشی</label>
            <input type="text" id="regName" placeholder="نام شما" required>
          </div>
          <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="regPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
          </div>
          <div class="form-group">
            <label>تکرار رمز عبور</label>
            <input type="password" id="regConfirm" placeholder="تکرار رمز" required>
          </div>
          <div class="error-msg" id="registerError"></div>
          <button type="submit" class="btn" id="registerBtn">
            <i class="fa-solid fa-user-plus"></i> ثبت‌نام
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // API endpoints
    const LOGIN_API = 'https://script.google.com/macros/s/AKfycbzLZIvfcGum-bGKc2WcvR5kWAKrQRofpp8vHYtirItcRKe1ZSmXGfKkslFXX4bYyVmF/exec';
    const PRIVATE_API = 'https://script.google.com/macros/s/AKfycbxxdtjStKHRxfsmxyQ7djHuuq56PUeSNxQO53DP9hb01nTY-EvqafwMOEyI77TrNWRm4g/exec';

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('i');
    const savedTheme = localStorage.getItem('dox-theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.classList.replace('fa-moon', 'fa-sun');
    }
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeIcon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('dox-theme', isDark ? 'light' : 'dark');
    });

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      if (tab === 'login') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('login-tab').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('register-tab').classList.add('active');
      }
      // Clear errors
      document.getElementById('loginError').textContent = '';
      document.getElementById('registerError').textContent = '';
    }

    // Login handler
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ورود...';
      errorEl.textContent = '';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(LOGIN_API, {
          method: 'POST',
          mode: 'no-cors', // Apps Script requires CORS setup; using no-cors won't give us JSON, so we'll need to use GET-like or set up CORS on Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });

        // Since no-cors returns opaque response, we can't read JSON.
        // Alternative: Use GET method with query parameters? But login should be POST.
        // Better: Enable CORS on Apps Script login endpoint (already likely set).
        // Let's assume CORS is enabled. We'll use regular POST without no-cors.
      } catch (error) {
        errorEl.textContent = 'خطای شبکه';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> ورود';
      }
    }

    // Since Apps Script might have CORS issues, we'll adjust fetch to not use no-cors and handle properly.
    // I'll rewrite handleLogin with proper POST and no 'no-cors'.
    // Also register handler placeholder.

    // Redefine immediately
  </script>
  <script>
    // Proper fetch with CORS (assuming Apps Script returns Access-Control-Allow-Origin)
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ورود...';
      errorEl.textContent = '';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(LOGIN_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', username, password })
        });

        const result = await response.json();
        if (result.success) {
          localStorage.setItem('dox_token', result.token);
          localStorage.setItem('dox_username', username);
          window.location.href = '../dashboard/';
        } else {
          errorEl.textContent = result.error || 'نام کاربری یا رمز اشتباه است';
        }
      } catch (error) {
        errorEl.textContent = 'خطا در ارتباط با سرور';
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> ورود';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const errorEl = document.getElementById('registerError');
      const username = document.getElementById('regUsername').value.trim();
      const name = document.getElementById('regName').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;

      errorEl.textContent = '';

      if (password !== confirm) {
        errorEl.textContent = 'رمز عبور و تکرار آن مطابقت ندارند';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشد';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ثبت‌نام...';

      try {
        // Since register is not yet in login API, we attempt to call addPlayer in private API?
        // But addPlayer requires token. So we need a register action in login API.
        // For now, we'll call a hypothetical action 'register' in login API.
        const response = await fetch(LOGIN_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register',
            username,
            name,
            password
          })
        });

        const result = await response.json();
        if (result.success) {
          // After successful registration, auto-login or redirect to login tab
          document.getElementById('regUsername').value = '';
          document.getElementById('regName').value = '';
          document.getElementById('regPassword').value = '';
          document.getElementById('regConfirm').value = '';
          alert('ثبت‌نام موفق! حالا وارد شوید.');
          switchTab('login');
        } else {
          errorEl.textContent = result.error || 'خطا در ثبت‌نام';
        }
      } catch (error) {
        errorEl.textContent = 'ثبت‌نام در حال حاضر در دسترس نیست. لطفاً بعداً تلاش کنید.';
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> ثبت‌نام';
      }
    }

    // Re-attach submit handlers (since we redefined functions)
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('registerForm').addEventListener('submit', handleRegister);
  </script>
</body>
</html>

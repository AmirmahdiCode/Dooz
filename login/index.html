<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به دوز | XO Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --primary: #2C4F6E; --primary-dark: #1A3A52;
      --primary-light: #7BA5C9; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #000000; --shadow: 4px 4px 0 #000000;
      --shadow-hover: 6px 6px 0 #000000; --shadow-sm: 2px 2px 0 #000000;
      --header-bg: #ffffff; --footer-bg: #ffffff;
      --overlay: rgba(44,79,110,0.05); --logo-filter: none;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --primary: #4A7FA3; --primary-dark: #2C4F6E;
      --primary-light: #7BA5C9; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --header-bg: #1e293b; --footer-bg: #1e293b; --logo-filter: brightness(0) invert(1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }

    /* هدر */
    .header {
      background: var(--header-bg); box-shadow: 0 4px 0 #000000;
      padding: 14px 20px; border: 1px solid #000000; border-top: none;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 42px; height: 42px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000; overflow: hidden; padding: 6px;
      border: 1px solid #000000;
    }
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 20px; font-weight: 700; color: var(--dark); }
    .theme-toggle {
      background: var(--bg2); border: 1px solid #000000; padding: 10px;
      border-radius: 4px; cursor: pointer; font-size: 18px; color: var(--text);
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000; transition: all 0.15s ease;
    }
    .theme-toggle:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000000; }

    /* محتوای اصلی */
    .main-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
    }
    .login-wrapper { width: 100%; max-width: 440px; }
    .logo-section { text-align: center; margin-bottom: 28px; }
    .logo-img {
      width: 72px; height: 72px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 4px 4px 0 #000000; border: 1px solid #000000; padding: 8px; margin-bottom: 12px;
    }
    .logo-img img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
    .site-title { font-size: 26px; font-weight: 800; color: var(--dark); }

    .card {
      background: var(--card-bg); border: 1px solid #000000; border-radius: 4px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .tabs { display: flex; border-bottom: 1px solid #000; }
    .tab-btn {
      flex: 1; padding: 16px; background: var(--bg2); border: none;
      border-left: 1px solid #000; font-size: 15px; font-weight: 700;
      cursor: pointer; color: var(--text); transition: all 0.15s; font-family: inherit;
    }
    .tab-btn:last-child { border-left: none; }
    .tab-btn.active { background: var(--card-bg); color: var(--primary-dark); box-shadow: inset 0 -3px 0 var(--primary); }

    .tab-content { display: none; padding: 28px 24px; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--dark); }
    input {
      width: 100%; padding: 14px; border: 1px solid #000; border-radius: 4px;
      font-size: 15px; background: var(--bg); color: var(--dark);
      box-shadow: var(--shadow-sm); transition: all 0.15s; font-family: inherit;
    }
    input:focus { outline: none; transform: translate(1px,1px); box-shadow: 1px 1px 0 #000; }

    .btn {
      width: 100%; padding: 14px; background: var(--primary); color: #fff;
      border: 1px solid #000; border-radius: 4px; font-size: 16px; font-weight: 700;
      cursor: pointer; box-shadow: var(--shadow); transition: all 0.15s; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .forgot-link {
      display: block; text-align: right; margin-top: 14px; font-size: 13px;
      color: var(--primary); text-decoration: none; font-weight: 600;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* فوتر */
    .footer {
      text-align: center; padding: 20px; background: var(--footer-bg);
      border-top: 1px solid #000; font-size: 11px; color: var(--text-light);
    }

    /* ناحیه نوتیفیکیشن‌های شناور */
    .toast-container {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .toast {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; border-radius: 4px; border: 1px solid #000;
      box-shadow: 4px 4px 0 #000; font-size: 14px; font-weight: 600;
      color: #fff; min-width: 280px; max-width: 400px;
      pointer-events: auto; cursor: pointer;
      animation: toastIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2) forwards,
                 toastOut 0.3s ease-in forwards;
      animation-delay: 0s, 4s;
    }
    .toast i { font-size: 18px; flex-shrink: 0; }
    .toast.error { background: #dc2626; }
    .toast.warning { background: #d97706; }
    .toast.success { background: #10b981; }

    @keyframes toastIn {
      0% { opacity: 0; transform: translateY(-60px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.95); }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-right">
      <div class="header-logo">
        <img src="https://cdn.imgurl.ir/uploads/u808451_InShot_20260809_201438207.png" alt="لوگو">
      </div>
      <span class="header-title">X O . G A M E</span>
    </div>
    <div class="header-left">
      <button class="theme-toggle" id="themeToggle" title="تغییر تم">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- محفظه نوتیفیکیشن‌ها -->
  <div class="toast-container" id="toastContainer"></div>

  <main class="main-container">
    <div class="login-wrapper">
      <div class="logo-section">
        <div class="logo-img">
          <img src="https://cdn.imgurl.ir/uploads/u808451_InShot_20260809_201438207.png" alt="لوگو">
        </div>
        <div class="site-title">X O . G A M E</div>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('login')">ورود</button>
          <button class="tab-btn" onclick="switchTab('register')">ثبت‌نام</button>
        </div>

        <div class="tab-content active" id="login-tab">
          <form id="loginForm">
            <div class="form-group">
              <label>نام کاربری</label>
              <input type="text" id="loginUsername" placeholder="Username" required>
            </div>
            <div class="form-group">
              <label>رمز عبور</label>
              <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">
              <i class="fa-solid fa-arrow-right-to-bracket"></i> ورود
            </button>
            <a href="./forget/" class="forgot-link">فراموشی رمز عبور؟</a>
          </form>
        </div>

        <div class="tab-content" id="register-tab">
          <form id="registerForm">
            <div class="form-group">
              <label>نام کاربری</label>
              <input type="text" id="regUsername" placeholder="انتخاب نام کاربری" required>
            </div>
            <div class="form-group">
              <label>نام نمایشی</label>
              <input type="text" id="regName" placeholder="نام شما" required>
            </div>
            <div class="form-group">
              <label>رمز عبور</label>
              <input type="password" id="regPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
            </div>
            <div class="form-group">
              <label>تکرار رمز عبور</label>
              <input type="password" id="regConfirm" placeholder="تکرار رمز" required>
            </div>
            <button type="submit" class="btn" id="registerBtn">
              <i class="fa-solid fa-user-plus"></i> ثبت‌نام
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    XO Game — ساخته‌شده با عشق ❤️ | نسخه ۱.۰
  </footer>

  <script>
    const LOGIN_API = 'https://script.google.com/macros/s/AKfycbzLZIvfcGum-bGKc2WcvR5kWAKrQRofpp8vHYtirItcRKe1ZSmXGfKkslFXX4bYyVmF/exec';

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('i');
    if (localStorage.getItem('dox-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.classList.replace('fa-moon', 'fa-sun');
    }
    themeToggle.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeIcon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('dox-theme', isDark ? 'light' : 'dark');
    };

    // Toast notification
    function showToast(message, type = 'error') {
      const container = document.getElementById('toastContainer');
      const icons = { error: 'fa-circle-exclamation', warning: 'fa-triangle-exclamation', success: 'fa-circle-check' };
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type]}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 4500);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (tab === 'login') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('login-tab').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('register-tab').classList.add('active');
      }
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ورود...';
      try {
        const res = await fetch(LOGIN_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'login',
            username: document.getElementById('loginUsername').value.trim(),
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('dox_token', data.token);
          localStorage.setItem('dox_username', document.getElementById('loginUsername').value.trim());
          showToast('ورود موفق! در حال انتقال...', 'success');
          setTimeout(() => { window.location.href = '../dashboard/'; }, 800);
        } else {
          showToast(data.error || 'نام کاربری یا رمز اشتباه است', 'error');
        }
      } catch (ex) {
        showToast('خطا در ارتباط با سرور', 'warning');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> ورود';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const pw = document.getElementById('regPassword').value;
      if (pw !== document.getElementById('regConfirm').value) {
        showToast('رمز عبور و تکرار آن مطابقت ندارند', 'error'); return;
      }
      if (pw.length < 6) {
        showToast('رمز عبور باید حداقل ۶ کاراکتر باشد', 'warning'); return;
      }
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ثبت‌نام...';
      try {
        const res = await fetch(LOGIN_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register',
            username: document.getElementById('regUsername').value.trim(),
            name: document.getElementById('regName').value.trim(),
            password: pw
          })
        });
        const data = await res.json();
        if (data.success) {
          showToast('ثبت‌نام موفق! حالا وارد شوید.', 'success');
          document.getElementById('regUsername').value = '';
          document.getElementById('regName').value = '';
          document.getElementById('regPassword').value = '';
          document.getElementById('regConfirm').value = '';
          switchTab('login');
        } else {
          showToast(data.error || 'خطا در ثبت‌نام', 'error');
        }
      } catch (ex) {
        showToast('ثبت‌نام موقتاً در دسترس نیست', 'warning');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> ثبت‌نام';
      }
    });
  </script>
</body>
</html>
